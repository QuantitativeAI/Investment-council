<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Council</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/marked@latest/marked.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --panel-soft: #fbfcfe;
  --ink: #1f2937;
  --ink-soft: #64748b;
  --ink-faint: #94a3b8;
  --border: #e5e9f0;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #eff4ff;
  --gold: #b45309;
  --gold-deep: #92400e;
  --gold-soft: #fffbeb;
  --gold-border: #fcd34d;
  --green-soft: #ecfdf5;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --sidebar-bg: #0f172a;
  --sidebar-hover: #1e293b;
  --sidebar-text: #cbd5e1;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.06);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  display: flex;
  overflow: hidden;
}
button { font-family: inherit; }

/* ============ Sidebar ============ */
.sidebar {
  width: 264px; min-width: 264px;
  background: linear-gradient(180deg, #0f172a 0%, #131f38 100%);
  color: var(--sidebar-text);
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 18px 16px 14px;
  display: flex; flex-direction: column; gap: 14px;
  border-bottom: 1px solid rgba(148,163,184,.14);
}
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark {
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  display:flex; align-items:center; justify-content:center;
  font-size:19px;
  box-shadow: 0 4px 14px rgba(37,99,235,.4);
}
.brand-name { color:#fff; font-weight:700; font-size:14.5px; letter-spacing:-.01em; line-height:1.25; }
.brand-sub { color:#64748b; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }
.btn-new-session {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color:#fff; border:none; border-radius:10px;
  padding:9px 14px; cursor:pointer;
  font-size:13px; font-weight:600;
  transition: filter .15s, transform .1s;
  box-shadow: 0 3px 10px rgba(37,99,235,.3);
}
.btn-new-session:hover { filter: brightness(1.12); }
.btn-new-session:active { transform: scale(.98); }
.session-list { flex:1; overflow-y:auto; padding:10px; }
.session-item {
  display:flex; align-items:center; gap:8px;
  padding:9px 12px; border-radius:10px; cursor:pointer;
  font-size:12.5px; margin-bottom:3px;
  border:1px solid transparent;
  transition: background .15s;
}
.session-item:hover { background: var(--sidebar-hover); }
.session-item.active { background: rgba(37,99,235,.16); border-color: rgba(59,130,246,.35); color:#fff; }
.sess-dot { width:7px; height:7px; border-radius:50%; background:transparent; flex-shrink:0; }
.sess-dot.running { background:#f59e0b; box-shadow:0 0 8px rgba(245,158,11,.8); animation: blink-soft 1.3s infinite; }
.sess-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.session-del { display:none; color:#64748b; font-size:16px; line-height:1; cursor:pointer; flex-shrink:0; padding:0 2px; }
.session-item:hover .session-del { display:inline; }
.session-del:hover { color:#f87171; }

/* ============ Main ============ */
.main {
  flex:1; min-width:0;
  display:flex; flex-direction:column;
  background:
    radial-gradient(900px 420px at 75% -8%, rgba(59,130,246,.09), transparent 60%),
    radial-gradient(700px 380px at 8% 108%, rgba(245,158,11,.07), transparent 60%),
    var(--bg);
}

/* Header */
.chat-header {
  display:flex; align-items:center; gap:12px;
  padding:11px 18px;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.chat-title {
  font-size:15px; font-weight:700; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36%;
}
.pill {
  display:inline-flex; align-items:center; gap:7px;
  font-size:11.5px; font-weight:600;
  padding:4px 12px; border-radius:99px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46%;
}
.pill-live { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
.pill-dot { width:7px; height:7px; border-radius:50%; background:#f97316; flex-shrink:0; animation:blink-soft 1.3s infinite; }
.pill-done { background:var(--green-soft); color:#15803d; border:1px solid #bbf7d0; }
.pill-idle { visibility:hidden; }
.header-actions { margin-left:auto; display:flex; gap:8px; align-items:center; flex-shrink:0; }
.btn-report {
  display:none; align-items:center; gap:6px;
  background:var(--gold-soft); color:var(--gold-deep);
  border:1px solid var(--gold-border); border-radius:10px;
  padding:7px 14px; cursor:pointer; font-size:12.5px; font-weight:600;
}
.btn-report.visible { display:inline-flex; }
.btn-report:hover { background:#fef3c7; }
.btn-stop {
  display:none; align-items:center; gap:6px;
  background:var(--red); color:#fff; border:none; border-radius:10px;
  padding:7px 16px; cursor:pointer; font-size:12.5px; font-weight:600;
}
.btn-stop.visible { display:inline-flex; }
.btn-stop:hover { background:#b91c1c; }

/* Topic bar */
.topic-bar {
  display:flex; align-items:center; gap:10px;
  margin:12px 16px 0; padding:9px 14px;
  background:linear-gradient(90deg,#eef4ff,#f8fafc);
  border:1px solid #dbe7fb; border-radius:12px;
  font-size:13px; flex-shrink:0;
}
.topic-ico { font-size:15px; }
.topic-text { font-weight:600; color:#1e3a8a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Meeting area */
.meeting-area {
  flex:1; min-height:0;
  display:flex; flex-direction:column; gap:12px;
  padding:12px 16px;
}
.council { flex:1; min-height:0; display:flex; flex-direction:row; gap:12px; }
.chair-column {
  flex:1; min-width:0; min-height:0;
  display:flex; flex-direction:column; gap:12px;
}
.mod-panel {
  flex:0 1 auto; min-height:110px; max-height:55%;
  border-top:3px solid #f59e0b;
}
.experts-grid {
  flex:1; min-width:0; min-height:0;
  display:grid; grid-template-columns:1fr; grid-auto-rows:minmax(0,1fr); gap:12px;
}
.experts-grid > * { min-height:0; }
.report-section {
  flex:1 1 0; min-height:40%;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg,#fffdf6,#fff);
  border:1px solid var(--gold-border); border-radius:var(--radius);
  box-shadow:0 4px 20px rgba(180,83,9,.10);
  overflow:hidden;
}
.report-placeholder {
  height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  margin:10px;
  border:1.5px dashed var(--gold-border); border-radius:12px;
  background:#fffdf8;
  color:var(--ink-faint); font-size:12.5px; line-height:1.6;
  text-align:center; padding:20px;
}
.report-placeholder .ph-icon { font-size:30px; opacity:.65; }
.report-tag.pending { background:#fff7e6; color:var(--ink-faint); border:1px dashed #e8d5a8; }

/* Live round digest (report area before the final report) */
.live-summary { display:flex; flex-direction:column; gap:10px; height:100%; overflow-y:auto; padding:2px; }
.ls-head {
  display:flex; align-items:center; gap:7px; flex-shrink:0;
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:var(--gold);
}
.ls-count { margin-left:auto; font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-faint); font-size:11px; }
.ls-round { background:#fffdf8; border:1px solid #f3e2b3; border-radius:10px; padding:8px 12px; flex-shrink:0; }
.ls-round-head { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
.ls-round-title { font-size:12px; font-weight:600; color:#7c2d12; }
.ls-round-text { font-size:12px; line-height:1.55; color:var(--ink-soft); }
.ls-round-active {
  display:flex; align-items:center; gap:8px; flex-shrink:0;
  background:#fff; border:1.5px dashed #e8d5a8; border-radius:10px;
  color:var(--ink-soft); font-size:12px; font-style:italic;
  padding:8px 12px;
}
/* Report export */
.report-head-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
.btn-pdf {
  display:none; align-items:center; gap:6px;
  background:var(--gold-deep); color:#fff; border:none; border-radius:8px;
  padding:5px 12px; cursor:pointer; font-size:12px; font-weight:600;
  transition:filter .15s;
}
.btn-pdf.visible { display:inline-flex; }
.btn-pdf:hover { filter:brightness(1.15); }
.report-body h1, .report-body h2, .report-body h3 { page-break-after: avoid; }
.report-body pre, .report-body table, .report-body blockquote { page-break-inside: avoid; }
/* Must stay an in-flow block: html2pdf deep-clones this element into its own
   hidden container, so positioned clones would escape it and collapse the
   container height to zero, producing a blank PDF. */
.pdf-clone {
  width:100%;
  background:#fff;
  border:none; border-radius:0; box-shadow:none;
}
.pdf-doc-head { margin-bottom:16px; border-bottom:2px solid var(--gold-border); padding-bottom:10px; }
.pdf-doc-title { font-size:20px; font-weight:800; letter-spacing:-.01em; }
.pdf-doc-sub { font-size:12px; color:var(--ink-soft); margin-top:3px; }

/* Panels */
.panel {
  display:flex; flex-direction:column; min-height:0;
  background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.expert-panel { border-top:3px solid var(--agent-color, var(--accent)); }
.panel-head {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  background:#fff;
  flex-shrink:0;
}
.mod-panel .panel-head {
  background:linear-gradient(180deg,#fff7e0,#fffdf7);
  border-bottom:1px solid #f3e2b3;
}
.avatar {
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:17px; color:#fff; font-weight:700;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,.18);
}
.mod-panel .avatar { width:38px; height:38px; border-radius:12px; font-size:19px; }
.panel-id { min-width:0; }
.panel-name { font-size:13.5px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mod-panel .panel-name { color:#7c2d12; }
.panel-role {
  font-size:11px; color:var(--ink-soft); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mod-panel .panel-role { color:#b45309; }
.panel-status { margin-left:auto; flex-shrink:0; }
.mini-think {
  display:inline-flex; align-items:center; gap:6px;
  font-size:10.5px; font-weight:600; color:var(--ink-soft);
  background:#f1f5f9; border:1px solid var(--border);
  padding:3px 10px; border-radius:99px;
}
.panel-body {
  flex:1; min-height:0; overflow-y:auto;
  padding:10px 12px 14px;
  background:var(--panel-soft);
  display:flex; flex-direction:column; gap:8px;
}
.panel-empty {
  margin:auto; width:100%; text-align:center;
  color:var(--ink-faint); font-size:12px;
  border:1.5px dashed var(--border); border-radius:10px;
  padding:20px 12px;
}

/* Entries */
.entry, .user-bubble, .search-card, .search-chip, .sys-line { animation: rise .22s ease; }
@keyframes rise { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.entry {
  background:#fff; border:1px solid var(--border); border-radius:10px;
  padding:10px 12px;
  box-shadow:0 1px 1px rgba(15,23,42,.03);
}
.entry-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.round-badge {
  font-size:10.5px; font-weight:700; letter-spacing:.02em;
  padding:1px 8px; border-radius:99px;
  color:var(--ink-soft); background:#f1f5f9; border:1px solid var(--border);
}
.entry-label {
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color:var(--gold);
}
.mod-entry { background:#fffdf4; border-color:#f1e3b8; }
.error-entry { background:var(--red-soft); border-color:#fecaca; }
.error-entry .entry-content { color:#991b1b; font-size:13px; }

.sys-line {
  display:flex; align-items:center; justify-content:center; gap:8px;
  text-align:center; font-size:11.5px; color:var(--ink-faint);
  padding:2px 8px;
}
.sys-line::before, .sys-line::after { content:''; height:1px; background:var(--border); flex:1; max-width:56px; }
.sys-gold { color:var(--gold-deep); font-weight:600; }

.thinking-entry {
  display:flex; align-items:center; gap:8px;
  background:#f8fafc; border:1.5px dashed #cbd5e1; border-radius:10px;
  padding:8px 12px;
  font-size:12px; font-style:italic; color:var(--ink-soft);
}
.pulse {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
  background:var(--agent-color, var(--accent));
  animation:pulse-ring 1.3s infinite;
}
@keyframes pulse-ring {
  0% { box-shadow:0 0 0 0 rgba(100,116,139,.45); }
  70% { box-shadow:0 0 0 7px rgba(100,116,139,0); }
  100% { box-shadow:0 0 0 0 rgba(100,116,139,0); }
}
.dots::after { content:'...'; animation:dots-blink 1.4s infinite; }
@keyframes dots-blink { 0%,20% { content:'.'; } 40% { content:'..'; } 60%,100% { content:'...'; } }
@keyframes blink-soft { 50% { opacity:.35; } }

.search-chip {
  align-self:flex-start;
  font-size:11px; color:#1e40af;
  background:#eff6ff; border:1px solid #bfdbfe;
  padding:3px 10px; border-radius:99px;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.search-card {
  background:#f5faff; border:1px solid #d7e6f7; border-radius:10px; overflow:hidden;
}
.search-card summary {
  cursor:pointer; list-style:none;
  display:flex; align-items:center; gap:6px;
  font-size:12px; font-weight:600; color:#1d4ed8;
  padding:8px 12px; user-select:none;
}
.search-card summary::-webkit-details-marker { display:none; }
.search-card summary::after { content:'▾'; margin-left:auto; color:var(--ink-faint); transition:transform .2s; }
.search-card[open] summary::after { transform:rotate(180deg); }
.search-card-body { padding:2px 12px 10px; }

.user-bubble {
  align-self:flex-end; max-width:85%;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#fff; font-size:13px; line-height:1.55;
  border-radius:12px 12px 4px 12px;
  padding:8px 13px; white-space:pre-wrap; word-break:break-word;
  box-shadow:0 2px 8px rgba(37,99,235,.25);
}

/* Markdown */
.md { font-size:13px; line-height:1.65; color:var(--ink); word-break:break-word; }
.md > *:first-child { margin-top:0; }
.md > *:last-child { margin-bottom:0; }
.md p { margin:5px 0; }
.md h1, .md h2, .md h3, .md h4 { margin:10px 0 4px; line-height:1.3; font-weight:700; }
.md h1 { font-size:16px; } .md h2 { font-size:15px; } .md h3 { font-size:14px; } .md h4 { font-size:13.5px; }
.md ul, .md ol { padding-left:18px; margin:5px 0; }
.md li { margin:2.5px 0; }
.md table { border-collapse:collapse; margin:8px 0; width:100%; font-size:12.5px; display:block; overflow-x:auto; max-width:100%; }
.md th, .md td { border:1px solid var(--border); padding:5px 8px; text-align:left; }
.md th { background:#f4f6fa; font-weight:600; }
.md pre {
  background:#0f172a; color:#e2e8f0;
  border-radius:8px; padding:10px 12px;
  overflow-x:auto; font-size:12px; margin:8px 0;
  line-height:1.5;
}
.md pre code { background:none; border:none; padding:0; color:inherit; font-size:12px; }
.md code {
  background:#eef2f7; border:1px solid var(--border);
  padding:1px 5px; border-radius:5px; font-size:12px;
}
.md blockquote { border-left:3px solid var(--border); padding-left:10px; color:var(--ink-soft); margin:6px 0; }
.md a { color:var(--accent); text-decoration:underline; }
.md strong { font-weight:600; }
.md hr { border:none; border-top:1px solid var(--border); margin:10px 0; }

/* Report */
.report-head {
  display:flex; align-items:center; gap:12px;
  padding:12px 18px;
  background:linear-gradient(90deg,#fef3c7,#fffbeb);
  border-bottom:1px solid var(--gold-border);
  flex-shrink:0;
}
.report-seal { font-size:22px; }
.report-head h3 { font-size:15px; font-weight:800; color:var(--gold-deep); letter-spacing:-.01em; }
.report-sub { font-size:11px; color:#b45309; margin-top:1px; }
.report-tag {
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:var(--gold-deep); background:#fde68a;
  padding:3px 11px; border-radius:99px;
}
.report-body { flex:1; min-height:0; overflow-y:auto; padding:18px 26px 26px; }
.report-body.md { font-size:14px; line-height:1.7; }
.report-body h1 { font-size:19px; margin-top:18px; padding-bottom:6px; border-bottom:1px solid var(--gold-border); }
.report-body h1:first-child { margin-top:0; }
.report-body h2 { font-size:16px; margin-top:14px; }
.report-section.flash { animation:report-flash 1.7s ease; }
@keyframes report-flash {
  0% { box-shadow:0 0 0 4px rgba(245,158,11,.55); }
  100% { box-shadow:0 4px 20px rgba(180,83,9,.10); }
}

/* Input area */
.chat-input-area { padding:2px 16px 14px; flex-shrink:0; }
.input-shell {
  display:flex; gap:8px; align-items:flex-end;
  background:#fff;
  border:1.5px solid var(--border); border-radius:14px;
  padding:8px 8px 8px 14px;
  box-shadow:var(--shadow);
  transition:border-color .15s;
}
.input-shell:focus-within { border-color:var(--accent); }
.chat-textarea {
  flex:1; border:none; outline:none; resize:none;
  font-family:inherit; font-size:13.5px; line-height:1.5;
  min-height:40px; max-height:180px;
  background:transparent; color:var(--ink);
}
.chat-textarea::placeholder { color:var(--ink-faint); }
.search-skill-label {
  display:flex; align-items:center; gap:6px;
  font-size:12px; font-weight:500; color:var(--ink-soft);
  background:#f1f5f9; border:1px solid var(--border);
  padding:0 12px; height:42px; border-radius:11px;
  cursor:pointer; user-select:none; white-space:nowrap; flex-shrink:0;
}
.search-skill-label input { accent-color:var(--accent); width:14px; height:14px; cursor:pointer; }
.btn-send {
  width:42px; height:42px; border-radius:11px; border:none; flex-shrink:0;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#fff; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:filter .15s, transform .1s;
  box-shadow:0 3px 10px rgba(37,99,235,.3);
}
.btn-send:hover { filter:brightness(1.1); }
.btn-send:active { transform:scale(.95); }
.btn-send:disabled { background:#cbd5e1; box-shadow:none; cursor:default; }
.toggle-options {
  background:none; border:none; color:var(--accent);
  font-size:12px; font-weight:500; cursor:pointer;
  margin:8px 4px 0; padding:0;
}
.extra-options { display:none; gap:8px; margin-top:8px; }
.extra-options.visible { display:flex; flex-wrap:wrap; }
.extra-input {
  flex:1; min-width:170px;
  border:1px solid var(--border); border-radius:10px;
  padding:8px 12px; font-size:12.5px; font-family:inherit;
  outline:none; background:#fff; color:var(--ink);
}
.extra-input:focus { border-color:var(--accent); }
.extra-input::placeholder { color:var(--ink-faint); }

/* Welcome */
.welcome {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; padding:40px; text-align:center;
}
.welcome-emblem {
  width:86px; height:86px; border-radius:26px;
  background:linear-gradient(135deg,#3b82f6,#1e40af);
  display:flex; align-items:center; justify-content:center;
  font-size:44px;
  box-shadow:0 14px 34px rgba(37,99,235,.32);
  margin-bottom:4px;
}
.welcome h2 { font-size:25px; font-weight:800; letter-spacing:-.02em; }
.welcome-desc { font-size:13.5px; color:var(--ink-soft); max-width:480px; line-height:1.65; }
.roster { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:10px; max-width:640px; }
.roster-chip {
  display:flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--border); border-radius:99px;
  padding:5px 14px 5px 6px;
  font-size:12px; font-weight:600;
  box-shadow:var(--shadow);
}
.roster-chip .avatar { width:26px; height:26px; font-size:13px; border-radius:50%; }
.welcome-hint { font-size:12.5px; color:var(--ink-faint); margin-top:4px; }
.welcome-hint b { color:var(--accent); }

/* Scrollbars */
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb {
  background:#c3cad6; border-radius:5px;
  border:2.5px solid transparent; background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover { background:#a5aec0; border:2.5px solid transparent; background-clip:content-box; }
.sidebar ::-webkit-scrollbar-thumb { background:#334155; border:2.5px solid transparent; background-clip:content-box; }

/* Responsive */
@media (max-width: 900px) {
  .sidebar { width:212px; min-width:212px; }
  .chat-title { max-width:30%; }
  .meeting-area { overflow-y:auto; padding:10px 12px; }
  .council { flex:none; flex-direction:column; }
  .chair-column { flex:none; }
  .mod-panel { flex:none; height:40vh; min-height:240px; max-height:none; }
  .report-section { flex:none; min-height:0; height:60vh; }
  .experts-grid { flex:none; grid-template-columns:1fr; grid-auto-rows:auto; }
  .expert-panel { height:300px; }
  .topic-bar { margin:10px 12px 0; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-mark">🏛️</div>
      <div>
        <div class="brand-name">Investment Council</div>
        <div class="brand-sub">AI Expert Panel</div>
      </div>
    </div>
    <button class="btn-new-session" id="btnNewSession" onclick="newSession()">+ New Session</button>
  </div>
  <div class="session-list" id="sessionList"></div>
</div>

<!-- Main area (populated by JS) -->
<div class="main" id="mainArea"></div>

<script>
// ============================================================
// UI strings
// ============================================================
const T = {
  newSessionTitle: 'New Meeting',
  welcomeTitle: 'Investment Council',
  welcomeDesc: 'Convene a panel of AI experts to debate an investment question — they research, argue, and converge on a final report.',
  placeholderTopic: 'Enter a discussion topic to convene the council…',
  placeholderChat: 'Ask the Committee Chair a follow-up…',
  send: 'Send',
  stop: '⏹ Stop',
  searchLabel: '🔍 Web research',
  advancedOptions: '⚙ Advanced options',
  goalPlaceholder: 'Goal (optional)',
  bgPlaceholder: 'Background (optional — web research can auto-fill)',
  constraintsPlaceholder: 'Constraints (optional, one per line)',
  meetingComplete: 'Meeting complete',
  deleteTitle: 'Delete',
  thinking: 'Thinking',
  researchCard: 'Background research',
  resultWord: 'result',
  resultsWord: 'results',
  meetingStarting: 'Preparing…',
  searchTooltip: 'When enabled, the Committee Chair researches background information before the meeting starts',
  connError: 'Connection failed. Please check the server.',
  awaiting: 'Awaiting contributions…',
  interrupted: 'interrupted',
  viewReport: 'Final Report',
  reportTag: 'Delivered',
  reportDelivered: 'Final report delivered',
  reportPending: 'Pending',
  reportPlaceholder: 'The final report will appear here once the Committee Chair concludes the discussion.',
  liveSummaryHead: 'Discussion so far',
  roundWord: 'round',
  roundsWord: 'rounds',
  inProgress: 'in progress',
  pdfDocTitle: 'Final Investment Report',
  pdfButtonTitle: 'Download the final report as PDF',
  mdButtonTitle: 'Download the final report as Markdown',
  pdfError: 'Could not generate the PDF. Please try again.',
  openingLabel: 'Opening statement',
  summaryLabel: 'Round summary',
  followUpLabel: 'Follow-up',
  moderatorRole: 'Arbiter · Facilitates & summarizes',
};
function t(key) { return T[key] || key; }

// ============================================================
// State
// ============================================================
const MODERATOR_NAME = 'Committee Chair';
const sessions = {};      // id -> { title, ws, messages: [], running, meetingDone, searchEnabled, currentRound, roundTitles }
let activeSessionId = null;
let searchDefaultEnabled = localStorage.getItem('rt_search_default') === '1';
const ROSTER = { moderator: null, experts: [] };
const bodies = {};        // agent name -> { body, status, panel } (per rendered view)

const AGENT_COLORS = {
  'Committee Chair': '#b45309',
  'Business Analyst': '#2563eb',
  'Data Researcher': '#7c3aed',
  'Earnings Reviewer': '#0d9488',
  'Portfolio Manager': '#ea580c',
  'Innovation Expert': '#3498db',
  'Critical Expert': '#e74c3c',
  'Engineering Expert': '#2ecc71',
  'Domain Expert': '#9b59b6',
};
const FALLBACK_COLORS = ['#2563eb', '#7c3aed', '#0d9488', '#db2777', '#ea580c', '#4f46e5', '#0891b2', '#65a30d', '#9333ea', '#c026d3'];
const AGENT_EMOJI = {
  'Committee Chair': '⚖️',
  'Business Analyst': '📊',
  'Data Researcher': '🔬',
  'Earnings Reviewer': '💹',
  'Portfolio Manager': '💼',
  'Innovation Expert': '💡',
  'Critical Expert': '🧐',
  'Engineering Expert': '⚙️',
  'Domain Expert': '🎯',
};
function getAgentColor(name) {
  if (AGENT_COLORS[name]) return AGENT_COLORS[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return FALLBACK_COLORS[Math.abs(h) % FALLBACK_COLORS.length];
}
function getAgentAvatar(name) {
  if (name === MODERATOR_NAME) return '⚖️';
  if (AGENT_EMOJI[name]) return AGENT_EMOJI[name];
  return escapeHtml((name.charAt(0) || '?').toUpperCase());
}
function tint(hex, f) {
  f = (f === undefined) ? 0.9 : f;
  const n = parseInt(hex.slice(1), 16);
  if (isNaN(n) || hex.length !== 7) return '#f1f5f9';
  const m = c => Math.round(c + (255 - c) * f);
  return `rgb(${m((n >> 16) & 255)}, ${m((n >> 8) & 255)}, ${m(n & 255)})`;
}
function roleFor(name) {
  const e = ROSTER.experts.find(x => x.name === name);
  return e ? e.role : '';
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

// ============================================================
// Roster (fetched from /api/agents; panels are created on demand as fallback)
// ============================================================
async function loadRoster() {
  try {
    const res = await fetch('/api/agents');
    if (!res.ok) return;
    const list = await res.json();
    ROSTER.moderator = list.find(a => a.kind === 'moderator') || null;
    ROSTER.experts = list.filter(a => a.kind === 'expert');
  } catch { /* fall back to on-demand panel creation */ }
  const wr = document.getElementById('welcomeRoster');
  if (wr) wr.innerHTML = rosterChipsHtml();
  for (const [name, rec] of Object.entries(bodies)) {
    if (name === MODERATOR_NAME) continue;
    const roleEl = rec.panel ? rec.panel.querySelector('.panel-role') : null;
    const r = roleFor(name);
    if (roleEl && r) roleEl.textContent = r;
  }
}
function rosterChipsHtml() {
  const chips = [];
  const chair = ROSTER.moderator || { name: MODERATOR_NAME };
  chips.push(`<span class="roster-chip"><span class="avatar" style="background:linear-gradient(135deg,#f59e0b,#b45309)">⚖️</span>${escapeHtml(chair.name)}</span>`);
  for (const e of ROSTER.experts) {
    const c = getAgentColor(e.name);
    chips.push(`<span class="roster-chip"><span class="avatar" style="background:${c}">${getAgentAvatar(e.name)}</span>${escapeHtml(e.name)}</span>`);
  }
  return chips.join('');
}

// ============================================================
// Persistence (localStorage)
// ============================================================
function saveSessions() {
  const data = {};
  for (const [id, s] of Object.entries(sessions)) {
    data[id] = { title: s.title, messages: s.messages, meetingDone: s.meetingDone, searchEnabled: s.searchEnabled || false };
  }
  try {
    localStorage.setItem('rt_sessions', JSON.stringify(data));
    localStorage.setItem('rt_active', activeSessionId || '');
    localStorage.setItem('rt_search_default', searchDefaultEnabled ? '1' : '0');
  } catch {}
}
function loadSessions() {
  try {
    const raw = localStorage.getItem('rt_sessions');
    if (!raw) return false;
    const data = JSON.parse(raw);
    for (const [id, s] of Object.entries(data)) {
      sessions[id] = {
        title: s.title,
        ws: null,
        messages: s.messages || [],
        running: false,
        meetingDone: s.meetingDone || false,
        searchEnabled: s.searchEnabled !== undefined ? s.searchEnabled : searchDefaultEnabled,
      };
    }
    const savedActive = localStorage.getItem('rt_active');
    if (savedActive && sessions[savedActive]) activeSessionId = savedActive;
    return Object.keys(sessions).length > 0;
  } catch { return false; }
}

// ============================================================
// Session management
// ============================================================
function newSession() {
  const id = 'sess_' + Date.now();
  sessions[id] = {
    title: t('newSessionTitle'),
    ws: null,
    messages: [],
    running: false,
    meetingDone: false,
    searchEnabled: searchDefaultEnabled,
  };
  switchToSession(id);
  renderSessionList();
  saveSessions();
}
function handleSearchToggle(checked) {
  const session = sessions[activeSessionId];
  if (!session) return;
  session.searchEnabled = checked;
  searchDefaultEnabled = checked;
  saveSessions();
}
function switchToSession(id) {
  activeSessionId = id;
  renderSessionList();
  renderChatView();
  saveSessions();
}
function renderSessionList() {
  const list = document.getElementById('sessionList');
  if (!list) return;
  list.innerHTML = '';
  for (const [id, s] of Object.entries(sessions)) {
    const el = document.createElement('div');
    el.className = 'session-item' + (id === activeSessionId ? ' active' : '');
    el.innerHTML = `
      <span class="sess-dot ${s.running ? 'running' : ''}"></span>
      <span class="sess-title">${escapeHtml(s.title)}</span>
      <span class="session-del" title="${t('deleteTitle')}" onclick="event.stopPropagation();deleteSession('${id}')">×</span>`;
    el.onclick = () => switchToSession(id);
    list.appendChild(el);
  }
}
function deleteSession(id) {
  if (sessions[id] && sessions[id].running && sessions[id].ws) {
    try { sessions[id].ws.send(JSON.stringify({ action: 'stop_meeting' })); } catch {}
  }
  if (sessions[id] && sessions[id].ws) {
    try { sessions[id].ws.close(); } catch {}
  }
  delete sessions[id];
  if (activeSessionId === id) {
    const remaining = Object.keys(sessions);
    activeSessionId = remaining.length > 0 ? remaining[remaining.length - 1] : null;
  }
  renderSessionList();
  if (activeSessionId) renderChatView();
  else document.getElementById('mainArea').innerHTML = welcomeHtml();
  saveSessions();
}

// ============================================================
// View
// ============================================================
function welcomeHtml() {
  return `<div class="welcome">
    <div class="welcome-emblem">🏛️</div>
    <h2>${t('welcomeTitle')}</h2>
    <p class="welcome-desc">${t('welcomeDesc')}</p>
    <div class="roster" id="welcomeRoster">${rosterChipsHtml()}</div>
    <p class="welcome-hint">Click <b>+ New Session</b> to convene the council</p>
  </div>`;
}
function lastRoundTitle(messages) {
  let title = null;
  for (const m of messages) if (m.type === 'round_start') title = m.title;
  return title;
}
function firstUserTopic(messages) {
  for (const m of messages) if (m.type === 'user') return m.content;
  return null;
}
function statusPillHtml(session) {
  if (session.running) {
    return `<span class="pill pill-live" id="chatStatus"><span class="pill-dot"></span><span>${escapeHtml(session.currentRound || t('meetingStarting'))}</span></span>`;
  }
  if (session.meetingDone) {
    return `<span class="pill pill-done" id="chatStatus">✓ ${t('meetingComplete')}</span>`;
  }
  return `<span class="pill pill-idle" id="chatStatus"></span>`;
}
function updateStatusPill() {
  const session = sessions[activeSessionId];
  if (!session) return;
  const pill = document.getElementById('chatStatus');
  if (pill) pill.outerHTML = statusPillHtml(session);
}
function expertPanelHtml(name) {
  const color = getAgentColor(name);
  const role = roleFor(name) || 'Council expert';
  return `<section class="panel expert-panel" data-panel-name="${escapeAttr(name)}" style="--agent-color:${color}">
    <header class="panel-head">
      <div class="avatar" style="background:${color}">${getAgentAvatar(name)}</div>
      <div class="panel-id">
        <div class="panel-name">${escapeHtml(name)}</div>
        <div class="panel-role">${escapeHtml(role)}</div>
      </div>
      <div class="panel-status"></div>
    </header>
    <div class="panel-body"><div class="panel-empty">${t('awaiting')}</div></div>
  </section>`;
}
function renderChatView() {
  const main = document.getElementById('mainArea');
  const session = sessions[activeSessionId];
  if (!session) { main.innerHTML = welcomeHtml(); return; }

  for (const k of Object.keys(bodies)) delete bodies[k];

  const isChatMode = session.meetingDone && !session.running;
  const placeholder = isChatMode ? t('placeholderChat') : t('placeholderTopic');
  session.currentRound = session.currentRound || lastRoundTitle(session.messages);
  const hasReport = session.messages.some(m => m.type === 'final_report');
  const topic = firstUserTopic(session.messages);

  main.innerHTML = `
    <div class="chat-header">
      <span class="chat-title" id="chatTitle">${escapeHtml(session.title)}</span>
      ${statusPillHtml(session)}
      <div class="header-actions">
        <button class="btn-report ${hasReport ? 'visible' : ''}" id="btnReport" onclick="focusReport()">📜 ${t('viewReport')}</button>
        <button class="btn-stop ${session.running ? 'visible' : ''}" id="btnStop" onclick="stopMeeting()">${t('stop')}</button>
      </div>
    </div>
    ${topic ? `<div class="topic-bar"><span class="topic-ico">🎯</span><span class="topic-text">${escapeHtml(topic)}</span></div>` : ''}
    <div class="meeting-area" id="meetingArea">
      <div class="council" id="councilView">
        <div class="chair-column" id="chairColumn">
          <section class="panel mod-panel" id="panel-moderator">
            <header class="panel-head">
              <div class="avatar" style="background:linear-gradient(135deg,#f59e0b,#b45309)">⚖️</div>
              <div class="panel-id">
                <div class="panel-name">${escapeHtml(MODERATOR_NAME)}</div>
                <div class="panel-role">${t('moderatorRole')}</div>
              </div>
              <div class="panel-status" id="modStatus"></div>
            </header>
            <div class="panel-body" id="body-moderator"></div>
          </section>
          <section class="report-section" id="reportSection">
            <header class="report-head">
              <span class="report-seal">📜</span>
              <div>
                <h3>${t('viewReport')}</h3>
                <div class="report-sub">Prepared by the ${escapeHtml(MODERATOR_NAME)}</div>
              </div>
              <div class="report-head-actions">
                <button class="btn-pdf${hasReport ? ' visible' : ''}" id="btnMd" onclick="downloadReportMarkdown()" title="${t('mdButtonTitle')}">⬇ MD</button>
                <button class="btn-pdf${hasReport ? ' visible' : ''}" id="btnPdf" onclick="downloadReportPdf()" title="${t('pdfButtonTitle')}">⬇ PDF</button>
                <span class="report-tag${hasReport ? '' : ' pending'}">${hasReport ? t('reportTag') : t('reportPending')}</span>
              </div>
            </header>
            <div class="report-body md" id="reportBody">
              ${hasReport ? '' : `<div class="report-placeholder"><div class="ph-icon">📜</div><div>${t('reportPlaceholder')}</div></div>`}
            </div>
          </section>
        </div>
        <div class="experts-grid" id="expertsGrid">
          ${ROSTER.experts.map(e => expertPanelHtml(e.name)).join('')}
        </div>
      </div>
    </div>
    <div class="chat-input-area">
      <div class="input-shell">
        <textarea class="chat-textarea" id="topicInput" rows="1" placeholder="${placeholder}" onkeydown="handleInputKey(event)"></textarea>
        ${isChatMode ? '' : `<label class="search-skill-label" title="${t('searchTooltip')}">
          <input type="checkbox" id="searchSkill"${session.searchEnabled ? ' checked' : ''} onchange="handleSearchToggle(this.checked)"> ${t('searchLabel')}
        </label>`}
        <button class="btn-send" id="btnSend" onclick="sendTopic()" title="${t('send')}">➤</button>
      </div>
      ${isChatMode ? '' : `<button class="toggle-options" onclick="toggleOptions()">${t('advancedOptions')}</button>
      <div class="extra-options" id="extraOptions">
        <input class="extra-input" id="goalInput" placeholder="${t('goalPlaceholder')}">
        <textarea class="extra-input" id="bgInput" rows="3" placeholder="${t('bgPlaceholder')}" style="min-height:56px;resize:vertical"></textarea>
        <input class="extra-input" id="constraintsInput" placeholder="${t('constraintsPlaceholder')}">
      </div>`}
    </div>`;

  bodies[MODERATOR_NAME] = {
    body: document.getElementById('body-moderator'),
    status: document.getElementById('modStatus'),
    panel: document.getElementById('panel-moderator'),
  };
  document.querySelectorAll('#expertsGrid .expert-panel').forEach(p => {
    const name = p.getAttribute('data-panel-name');
    if (name) bodies[name] = { body: p.querySelector('.panel-body'), status: p.querySelector('.panel-status'), panel: p };
  });

  const ta = document.getElementById('topicInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
  });

  renderMessages();
  if (session.running) document.getElementById('btnSend').disabled = true;
}
function refreshTopicBar() {
  const session = sessions[activeSessionId];
  if (!session) return;
  const main = document.getElementById('mainArea');
  const area = main.querySelector('.meeting-area');
  if (!area) return;
  const topic = firstUserTopic(session.messages);
  const html = topic ? `<div class="topic-bar"><span class="topic-ico">🎯</span><span class="topic-text">${escapeHtml(topic)}</span></div>` : null;
  const existing = main.querySelector('.topic-bar');
  if (existing) existing.remove();
  if (html) area.insertAdjacentHTML('beforebegin', html);
}

// ============================================================
// Message routing
// ============================================================
function renderMessages() {
  const session = sessions[activeSessionId];
  if (!session) return;
  for (const msg of session.messages) routeMsg(msg, { replay: true });
  for (const rec of Object.values(bodies)) {
    if (rec.body) rec.body.scrollTop = rec.body.scrollHeight;
  }
  const rb = document.getElementById('reportBody');
  if (rb) rb.scrollTop = 0;
}
function appendMessage(msg) { appendMessageTo(activeSessionId, msg); }
function appendMessageTo(sessionId, msg) {
  const session = sessions[sessionId];
  if (!session) return;
  const realTypes = ['agent_message', 'moderator_summary', 'final_report', 'agent_error'];
  if (realTypes.includes(msg.type)) {
    // Remove corresponding agent_start message from history when the actual message arrives
    session.messages = session.messages.filter(m => !(m.type === 'agent_start' && m.agent === msg.agent && String(m.round) === String(msg.round)));
  }
  session.messages.push(msg);
  saveSessions();
  if (sessionId !== activeSessionId) { renderSessionList(); return; }
  if (realTypes.includes(msg.type)) {
    const sel = `[data-thinking-agent="${escapeAttr(msg.agent || '')}"][data-thinking-round="${escapeAttr(String(msg.round === undefined || msg.round === null ? '' : msg.round))}"]`;
    document.querySelectorAll(sel).forEach(el => el.remove());
  }
  routeMsg(msg);
}
function routeMsg(msg, opts) {
  opts = opts || {};
  const session = sessions[activeSessionId];
  if (msg.type === 'round_start') {
    if (session) {
      session.currentRound = msg.title;
      if (msg.round !== undefined && msg.round !== null && msg.round !== 'final') {
        session.roundTitles = session.roundTitles || {};
        session.roundTitles[msg.round] = msg.title;
        if (typeof msg.round === 'number') session.currentRoundNum = msg.round;
      }
    }
    if (!opts.replay) updateStatusPill();
    updateLiveSummary();
    return;
  }
  if (msg.type === 'final_report') { showFinalReport(msg, opts); return; }
  const spec = describeMsg(msg, session);
  const rec = bodyFor(spec.bodyName);
  if (!rec || !rec.body) return;
  if (spec.el) appendAndScroll(rec.body, spec.el, opts.replay);
  updatePanelStatus(spec.bodyName);
  if (msg.type === 'moderator_summary') updateLiveSummary();
}
function describeMsg(msg, session) {
  switch (msg.type) {
    case 'system':
    case 'meeting_end':
    case 'search_start':
      return { bodyName: MODERATOR_NAME, el: `<div class="sys-line">${escapeHtml(msg.content)}</div>` };
    case 'error':
      return { bodyName: msg.agent || MODERATOR_NAME, el: errorEntryHtml(msg) };
    case 'search_result':
      return { bodyName: MODERATOR_NAME, el: searchCardHtml(msg) };
    case 'agent_start': {
      const running = session ? session.running : false;
      if (running) return { bodyName: msg.agent, el: thinkingEntryHtml(msg) };
      return { bodyName: msg.agent, el: `<div class="sys-line">${escapeHtml(msg.agent)} · ${t('interrupted')}</div>` };
    }
    case 'agent_search':
      return { bodyName: msg.agent, el: searchChipHtml(msg) };
    case 'user':
      return { bodyName: MODERATOR_NAME, el: userBubbleHtml(msg) };
    default:
      break;
  }
  if (msg.type === 'agent_error') return { bodyName: msg.agent || MODERATOR_NAME, el: errorEntryHtml(msg) };
  const isMod = msg.agent === MODERATOR_NAME || msg.type === 'moderator_summary';
  if (isMod) return { bodyName: MODERATOR_NAME, el: modEntryHtml(msg) };
  return { bodyName: msg.agent, el: expertEntryHtml(msg) };
}
function bodyFor(name) {
  if (!name || name === MODERATOR_NAME) return bodies[MODERATOR_NAME] || null;
  if (bodies[name]) return bodies[name];
  return createExpertPanel(name);
}
function createExpertPanel(name) {
  const grid = document.getElementById('expertsGrid');
  if (!grid) return null;
  grid.insertAdjacentHTML('beforeend', expertPanelHtml(name));
  const p = grid.lastElementChild;
  const rec = { body: p.querySelector('.panel-body'), status: p.querySelector('.panel-status'), panel: p };
  bodies[name] = rec;
  return rec;
}
function appendAndScroll(body, html, replay) {
  const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 100;
  const empty = body.querySelector(':scope > .panel-empty');
  if (empty) empty.remove();
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const el = wrap.firstElementChild;
  if (!el) return;
  body.appendChild(el);
  if (replay || nearBottom || el.classList.contains('thinking-entry')) {
    requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
  }
}
function updatePanelStatus(name) {
  const rec = bodies[name];
  if (!rec || !rec.status) return;
  if (rec.body.querySelector('.thinking-entry')) {

function showFinalReport(msg, opts) {

function focusReport() {

// ============================================================
// Live round digest (report area before the final report)
// ============================================================
function parseRoundSummary(content) {
  const lines = String(content || '').split('\n');
  let section = '';
  const ideas = [];
  let next = '';
  for (const raw of lines) {
    const line = raw.trim();
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) { section = h[1].toLowerCase(); continue; }
    const bullet = line.replace(/^[-*]\s+/, '').replace(/\*\*/g, '').trim();
    if (!bullet) continue;
    if (/key idea/i.test(section) && ideas.length < 2) ideas.push(bullet);
    else if (/next step/i.test(section)) next = next ? next + ' ' + bullet : bullet;
  }
  return { ideas, next };
}
function mdToPlain(s) {
  return String(s || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]*)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/[*_~>#|]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function liveSummaryHtml(session) {
  const summaries = session.messages.filter(m => m.type === 'moderator_summary');
  const running = session.running;
  const currentRoundNum = (typeof session.currentRoundNum === 'number') ? session.currentRoundNum : null;
  const lastSummaryRound = summaries.length
    ? Math.max.apply(null, summaries.map(m => Number(m.round)))
    : 0;
  const activeRound = (running && currentRoundNum !== null && currentRoundNum >= 1 && currentRoundNum > lastSummaryRound) ? currentRoundNum : null;
  if (summaries.length === 0 && activeRound === null) {
    return `<div class="report-placeholder"><div class="ph-icon">📜</div><div>${t('reportPlaceholder')}</div></div>`;
  }
  const roundTitles = session.roundTitles || {};
  const chair = getAgentColor(MODERATOR_NAME);
  const items = [];
  if (activeRound !== null) {
    items.push(`<div class="ls-round-active"><span class="pulse" style="--agent-color:${chair}"></span> Round ${activeRound} ${t('inProgress')}…</div>`);
  }
  for (const m of summaries) {
    const title = roundTitles[m.round] || `Round ${m.round}`;
    const parsed = parseRoundSummary(m.content);
    let text = '';
    if (parsed.ideas.length) text = parsed.ideas.join(' · ');
    if (parsed.next) text = text ? text + '  →  ' + parsed.next : parsed.next;
    if (!text) text = mdToPlain(m.content);
    if (text.length > 300) text = text.slice(0, 300).replace(/\s+\S*$/, '') + '…';
    items.push(`<div class="ls-round">
      <div class="ls-round-head">
        <span class="round-badge" style="color:${chair};background:${tint(chair, .92)};border-color:${tint(chair, .72)}">R${m.round}</span>
        <span class="ls-round-title">${escapeHtml(title)}</span>
      </div>
      ${text ? `<div class="ls-round-text">${escapeHtml(text)}</div>` : ''}
    </div>`);
  }
  if (items.length === 0) {
    return `<div class="report-placeholder"><div class="ph-icon">📜</div><div>${t('reportPlaceholder')}</div></div>`;
  }
  const n = summaries.length;
  return `<div class="live-summary">
    <div class="ls-head"><span>📋</span> ${t('liveSummaryHead')}<span class="ls-count">${n} ${n === 1 ? t('roundWord') : t('roundsWord')} summarized</span></div>
    ${items.join('')}
  </div>`;
}
function updateLiveSummary() {
  const session = sessions[activeSessionId];
  if (!session) return;
  if (session.messages.some(m => m.type === 'final_report')) return;
  const bodyEl = document.getElementById('reportBody');
  if (!bodyEl) return;
  bodyEl.innerHTML = liveSummaryHtml(session);
}

// ============================================================
// PDF export of the final report
// ============================================================
function downloadReportPdf() {
  const session = sessions[activeSessionId];
  const bodyEl = document.getElementById('reportBody');
  if (!session || !bodyEl || !bodyEl.innerHTML.trim()) return;
  const base = (session.title && session.title !== t('newSessionTitle')) ? session.title : 'investment-council';
  const safe = base.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').substring(0, 60) || 'council-report';
  const fileName = safe + '-final-report.pdf';
  const headHtml = `<div class="pdf-doc-head">
      <div class="pdf-doc-title">📜 ${t('pdfDocTitle')}</div>
      <div class="pdf-doc-sub">${escapeHtml(session.title)} · ${escapeHtml(new Date().toLocaleDateString())}</div>
    </div>`;
  const contentHtml = headHtml + bodyEl.innerHTML;
  if (typeof html2pdf === 'undefined') {
    // Fallback: print-friendly window (user can Save as PDF from the print dialog)
    const w = window.open('', '_blank');
    if (!w) { alert(t('pdfError')); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + escapeHtml(session.title) + '</title><style>' +
      'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2937;padding:36px 44px;max-width:820px;margin:0 auto;font-size:13.5px;line-height:1.7;}' +
      'h1{font-size:20px;border-bottom:1px solid #fcd34d;padding-bottom:6px;margin:14px 0 6px;}' +
      'h2{font-size:16px;margin:12px 0 4px;} h3{font-size:14px;margin:10px 0 4px;}' +
      'table{border-collapse:collapse;width:100%;font-size:12.5px;}' +
      'th,td{border:1px solid #ddd;padding:5px 8px;text-align:left;}' +
      'th{background:#f4f6fa;}' +
      'pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:12px;}' +
      'code{background:#eef2f7;padding:1px 5px;border-radius:5px;font-size:12px;}' +
      'pre code{background:none;padding:0;}' +
      'blockquote{border-left:3px solid #ddd;margin:6px 0;padding-left:10px;color:#64748b;}' +
      '.pdf-doc-head{border-bottom:2px solid #fcd34d;padding-bottom:10px;margin-bottom:16px;}' +
      '.pdf-doc-title{font-size:22px;font-weight:800;}' +
      '.pdf-doc-sub{font-size:12px;color:#64748b;margin-top:3px;}' +
      '</style></head><body>' + contentHtml +
      '<script>window.onload=function(){window.print();}<\/script></body></html>');
    w.document.close();
    w.focus();
    return;
  }
  // Keep the clone out of sight while html2pdf sets up its hidden container.
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;visibility:hidden;pointer-events:none';
  const clone = document.createElement('div');
  clone.className = 'report-body md pdf-clone';
  clone.innerHTML = contentHtml;
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);
  const cleanup = () => { if (wrapper.parentNode) wrapper.parentNode.removeChild(wrapper); };
  html2pdf().set({
    margin: [12, 14, 14, 14],
    filename: fileName,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  }).from(clone).save().then(cleanup).catch(() => { cleanup(); alert(t('pdfError')); });
}

function downloadReportMarkdown() {
  const session = sessions[activeSessionId];
  if (!session) return;
  const report = session.messages.find(m => m.type === 'final_report');
  if (!report) return;
  const base = (session.title && session.title !== t('newSessionTitle')) ? session.title : 'investment-council';
  const safe = base.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').substring(0, 60) || 'council-report';
  const fileName = safe + '.md';
  const text = `# ${session.title || 'Investment Council Report'}\n\n*Investment Council final report · ${new Date().toLocaleDateString()}*\n\n---\n\n${report.content}\n`;
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ============================================================
// Entry builders
// ============================================================
function roundBadgeHtml(round, color) {
  if (round === undefined || round === null || round === 'final' || round === 'chat') return '';
  const session = sessions[activeSessionId];
  const tip = (session && session.roundTitles) ? (session.roundTitles[round] || ('Round ' + round)) : ('Round ' + round);
  const c = color || getAgentColor(MODERATOR_NAME);
  return `<span class="round-badge" title="${escapeAttr(tip)}" style="color:${c};background:${tint(c, .92)};border-color:${tint(c, .72)}">R${round}</span>`;
}
function expertEntryHtml(msg) {

  return `<div class="entry" style="border-left:3px solid ${color}">
    <div class="entry-head">${roundBadgeHtml(msg.round, color)}</div>

function searchChipHtml(msg) {
  const idx = (msg.search_index && msg.max_searches) ? `#${msg.search_index}/${msg.max_searches} · ` : '';
  const res = (msg.result_count !== undefined && msg.result_count !== null)
    ? ` → ${msg.result_count} ${msg.result_count === 1 ? t('resultWord') : t('resultsWord')}`
    : '';
  return `<div class="search-chip" title="${escapeAttr(msg.query)}">🔍 ${escapeHtml(idx)}“${escapeHtml(msg.query)}”${res}</div>`;

function searchCardHtml(msg) {

// ============================================================
// Content rendering
// ============================================================
function renderContent(text) {
  if (!text) return '';
  // Try to parse as JSON and render as readable content
  try {
    const obj = JSON.parse(text);
    if (typeof obj === 'object' && obj !== null) {
      const md = jsonToMarkdown(obj);
      return marked.parse(md);
    }
  } catch {}
  // Render as markdown
  return marked.parse(text);
}
function jsonToMarkdown(obj, depth) {
  depth = depth || 0;
  const lines = [];
  const indent = '  '.repeat(depth);
  for (const [key, val] of Object.entries(obj)) {
    const label = key.replace(/_/g, ' ');
    if (Array.isArray(val)) {
      lines.push(`${indent}**${label}:**`);
      for (const item of val) {
        if (typeof item === 'object' && item !== null) {
          lines.push(`${indent}- ` + Object.entries(item).map(([k, v]) => `**${k.replace(/_/g, ' ')}**: ${v}`).join(' | '));
        } else {
          lines.push(`${indent}- ${item}`);
        }
      }
    } else if (typeof val === 'object' && val !== null) {
      lines.push(`${indent}**${label}:**`);
      lines.push(jsonToMarkdown(val, depth + 1));
    } else {
      lines.push(`${indent}**${label}:** ${val}`);
    }
  }
  return lines.join('\n');
}

// ============================================================
// Actions
// ============================================================
function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendTopic();
  }
}
function toggleOptions() {
  const el = document.getElementById('extraOptions');
  if (el) el.classList.toggle('visible');
}
function ensureWs() {
  const session = sessions[activeSessionId];
  if (!session) return null;
  const sessionId = activeSessionId;
  if (session.ws && session.ws.readyState === WebSocket.OPEN) return session.ws;
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${protocol}://${location.host}/ws/${sessionId}`);
  session.ws = ws;
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'search_result' && sessionId === activeSessionId) {
      // Auto-fill background with search results
      const bgEl = document.getElementById('bgInput');
      if (bgEl) {
        const opts = document.getElementById('extraOptions');
        if (opts && !opts.classList.contains('visible')) opts.classList.add('visible');
        bgEl.value = msg.content;
      }
    }
    if (msg.type === 'meeting_end') {
      const s = sessions[sessionId];
      if (s) { s.running = false; s.meetingDone = true; }
      if (sessionId === activeSessionId) updateRunningUI(false);
      else { renderSessionList(); saveSessions(); }
    }
    appendMessageTo(sessionId, msg);
  };
  ws.onerror = () => {
    appendMessageTo(sessionId, { type: 'error', content: t('connError') });
    const s = sessions[sessionId];
    if (s && s.running) {
      s.running = false;
      if (sessionId === activeSessionId) updateRunningUI(false);
      renderSessionList();
    }
  };
  ws.onclose = () => {
    const s = sessions[sessionId];
    if (s && s.running) {
      s.running = false;
      if (sessionId === activeSessionId) updateRunningUI(false);
      renderSessionList();
    }
  };
  return ws;
}
function sendTopic() {
  const session = sessions[activeSessionId];
  if (!session || session.running) return;

  const topicEl = document.getElementById('topicInput');
  if (!topicEl) return;
  const topic = topicEl.value.trim();
  if (!topic) return;

  // If meeting already done, switch to chat mode
  if (session.meetingDone) {
    topicEl.value = '';
    topicEl.style.height = 'auto';
    appendMessage({ type: 'user', content: topic });
    const ws = ensureWs();
    const send = () => ws.send(JSON.stringify({ action: 'chat', message: topic }));
    if (ws.readyState === WebSocket.OPEN) { send(); }
    else { ws.addEventListener('open', send, { once: true }); }
    return;
  }

  const goalEl = document.getElementById('goalInput');
  const bgEl = document.getElementById('bgInput');
  const cEl = document.getElementById('constraintsInput');
  const searchSkillEl = document.getElementById('searchSkill');
  const goal = goalEl ? goalEl.value.trim() : '';
  const background = bgEl ? bgEl.value.trim() : '';
  const constraints = cEl ? cEl.value.trim() : '';
  const searchEnabled = searchSkillEl ? searchSkillEl.checked : false;

  // Update session and reset the view
  session.title = topic.substring(0, 30) + (topic.length > 30 ? '…' : '');
  session.currentRound = null;
  session.roundTitles = {};
  session.currentRoundNum = null;
  session.searchEnabled = searchEnabled;
  session.meetingDone = false;
  session.messages = [];
  saveSessions();

  topicEl.value = '';
  topicEl.style.height = 'auto';

  renderChatView();
  renderSessionList();
  appendMessage({ type: 'user', content: topic });
  refreshTopicBar();

  // Connect WebSocket (reuse if already open from search)
  const ws = ensureWs();
  session.running = true;
  updateRunningUI(true);

  const send = () => ws.send(JSON.stringify({
    action: 'start_meeting',
    topic, goal, background, constraints,
    search_enabled: searchEnabled,
  }));
  if (ws.readyState === WebSocket.OPEN) { send(); }
  else { ws.addEventListener('open', send, { once: true }); }
}
function stopMeeting() {
  const session = sessions[activeSessionId];
  if (!session || !session.ws) return;
  try { session.ws.send(JSON.stringify({ action: 'stop_meeting' })); } catch {}
}
function updateRunningUI(running) {
  const session = sessions[activeSessionId];
  const btn = document.getElementById('btnStop');
  const send = document.getElementById('btnSend');
  if (btn) btn.className = 'btn-stop' + (running ? ' visible' : '');
  if (send) send.disabled = running;
  if (session) {
    session.running = running;
    updateStatusPill();
  }
  renderSessionList();
  if (!running && session && session.meetingDone) renderChatView();
}

// Restore from localStorage or create first session
loadRoster();
if (loadSessions()) {
  renderSessionList();
  if (activeSessionId) renderChatView();
} else {
  newSession();
}
